name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libx11-dev libxtst-dev

      - name: Build
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: Rename
        run: mv makrobedy_linux makrobedy_linux_${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makrobedy_linux_${{ matrix.arch }}
          path: makrobedy_linux_${{ matrix.arch }}

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: chmod +x build_mac.sh && ./build_mac.sh

      - name: Rename
        run: mv makrobedy_mac makrobedy_mac_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makrobedy_mac_arm64
          path: makrobedy_mac_arm64

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: ARM64
            arch: arm64

    # VS2022 (toolset v143) - obraz windows-latest (VS2026) nie ma juz v143 dla ARM64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild makrobedy.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m

      - name: Rename
        shell: bash
        run: mv "${{ matrix.platform }}/Release/makrobedy.exe" "makrobedy-win-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makrobedy-win-${{ matrix.arch }}
          path: makrobedy-win-${{ matrix.arch }}.exe
