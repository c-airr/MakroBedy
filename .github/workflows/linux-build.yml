name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libx11-dev libxtst-dev

      - name: Build
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: makrobedy_linux
          path: makrobedy_linux
